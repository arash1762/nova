<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Nova | دستیار شخصی</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Tahoma, sans-serif;
  background: #101827;
  color: #fff;
}

.container {
  max-width: 650px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #70e1f5;
}

.subtitle {
  color: #9ba8bb;
  font-size: 12px;
  margin-top: 7px;
}

.card {
  background: #1c293b;
  border: 1px solid #29394e;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 17px;
}

h2 {
  font-size: 17px;
  margin-top: 0;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #34445b;
  background: #101827;
  color: white;
  font-size: 14px;
  margin-bottom: 10px;
  outline: none;
  font-family: Tahoma, sans-serif;
}

input::placeholder,
textarea::placeholder {
  color: #8795a9;
}

textarea {
  resize: vertical;
  min-height: 75px;
}

button {
  border: none;
  padding: 12px 16px;
  border-radius: 10px;
  background: #45c7df;
  color: #10202b;
  font-weight: bold;
  cursor: pointer;
  font-family: Tahoma, sans-serif;
  font-size: 13px;
}

button.delete {
  background: #9e4050;
  color: white;
}

button.edit {
  background: #d5a84c;
  color: #18202c;
}

button.secondary {
  background: #34445b;
  color: white;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #26364b;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

.item span {
  flex: 1;
}

.done {
  text-decoration: line-through;
  opacity: .5;
}

.empty {
  color: #8795a9;
  font-size: 13px;
  margin-top: 15px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  background: #26364b;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  overflow-wrap: anywhere;
}

.stat small {
  display: block;
  color: #aab7c9;
  margin-bottom: 9px;
  font-size: 12px;
}

.stat strong {
  font-size: 15px;
  display: block;
}

.income {
  color: #61dda1;
}

.expense {
  color: #ff8c9b;
}

.balance {
  color: #70e1f5;
}

.transaction {
  background: #26364b;
  padding: 13px;
  border-radius: 12px;
  margin-top: 11px;
}

.transaction-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}

.transaction-title {
  font-weight: bold;
  font-size: 14px;
}

.transaction-details {
  color: #aab7c9;
  font-size: 11px;
  line-height: 2;
  margin-top: 7px;
  overflow-wrap: anywhere;
}

.transaction-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.transaction-actions button {
  padding: 7px 11px;
}

.amount {
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
}

.section-label {
  color: #70e1f5;
  font-size: 12px;
  margin: 12px 0 7px;
}

footer {
  text-align: center;
  color: #64748b;
  font-size: 11px;
  margin: 30px 0 15px;
}

@media(max-width: 380px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 14px;
  }

  .stat strong {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div>
    <div class="logo">✦ NOVA</div>
    <div class="subtitle">دستیار هوشمند شخصی تو</div>
  </div>
  <div style="font-size:30px">🪐</div>
</header>

<section class="card">
  <h2>👋 خوش اومدی!</h2>
  <p id="date" class="subtitle"></p>
  <p>امروز قراره چه کاری انجام بدیم؟</p>
</section>

<!-- مدیریت مالی -->

<section class="card">
  <h2>💰 مدیریت مالی</h2>

  <div class="grid">
    <div class="stat">
      <small>مجموع درآمد</small>
      <strong class="income" id="totalIncome">۰ تومان</strong>
    </div>

    <div class="stat">
      <small>مجموع هزینه</small>
      <strong class="expense" id="totalExpense">۰ تومان</strong>
    </div>

    <div class="stat">
      <small>مانده حساب</small>
      <strong class="balance" id="balance">۰ تومان</strong>
    </div>

    <div class="stat">
      <small>هزینه امروز</small>
      <strong id="todayExpense">۰ تومان</strong>
    </div>
  </div>

  <div class="section-label">ثبت تراکنش جدید</div>

  <select id="transactionType">
    <option value="expense">هزینه</option>
    <option value="income">درآمد</option>
  </select>

  <input
    id="transactionAmount"
    type="text"
    inputmode="numeric"
    placeholder="مبلغ به تومان"
  >

  <input
    id="transactionTitle"
    type="text"
    placeholder="عنوان، مثلاً خرید بنزین"
  >

  <select id="transactionCategory"></select>

  <select id="transactionAccount">
    <option value="نقدی">نقدی</option>
    <option value="کارت بانکی">کارت بانکی</option>
    <option value="پس‌انداز">پس‌انداز</option>
    <option value="سایر">سایر</option>
  </select>

  <select id="transactionMethod">
    <option value="کارت">پرداخت با کارت</option>
    <option value="نقدی">پرداخت نقدی</option>
    <option value="انتقال بانکی">انتقال بانکی</option>
    <option value="آنلاین">پرداخت آنلاین</option>
    <option value="سایر">سایر</option>
  </select>

  <label class="section-label">تاریخ و ساعت</label>

  <input
    id="transactionDate"
    type="datetime-local"
  >

  <textarea
    id="transactionDescription"
    placeholder="توضیحات بیشتر (اختیاری)"
  ></textarea>

  <button id="saveTransactionButton" onclick="saveTransaction()">
    + ثبت تراکنش
  </button>

  <button
    id="cancelEditButton"
    class="secondary"
    onclick="cancelEdit()"
    style="display:none"
  >
    لغو ویرایش
  </button>

  <div class="section-label">جست‌وجو در تراکنش‌ها</div>

  <input
    id="transactionSearch"
    type="search"
    placeholder="جست‌وجوی عنوان یا دسته‌بندی..."
    oninput="renderTransactions()"
  >

  <select id="transactionFilter" onchange="renderTransactions()">
    <option value="all">همه تراکنش‌ها</option>
    <option value="expense">فقط هزینه‌ها</option>
    <option value="income">فقط درآمدها</option>
  </select>

  <div class="section-label">سوابق تراکنش‌ها</div>
  <div id="transactionList"></div>

</section>

<!-- مدیریت کارها -->

<section class="card">
  <h2>📋 مدیریت کارها</h2>

  <input
    id="taskInput"
    placeholder="کار جدیدت رو بنویس..."
  >

  <button onclick="addTask()">+ افزودن کار</button>

  <div id="taskList"></div>
</section>

<!-- یادداشت ها -->

<section class="card">
  <h2>📝 یادداشت‌ها</h2>

  <input
    id="noteTitle"
    placeholder="عنوان یادداشت"
  >

  <textarea
    id="noteText"
    placeholder="یادداشتت رو اینجا بنویس..."
  ></textarea>

  <button onclick="addNote()">+ ذخیره یادداشت</button>

  <div id="noteList"></div>
</section>

<footer>
  NOVA PERSONAL ASSISTANT · VERSION 2.0
</footer>

</div>

<script>

// -------------------------
// ابزارهای عمومی
// -------------------------

function readStorage(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return Array.isArray(value) ? value : fallback;
  } catch {
    return fallback;
  }
}

function faNumber(value) {
  return Number(value || 0).toLocaleString("fa-IR");
}

function normalizeNumber(value) {
  const digits = {
    "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
    "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9",
    "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
    "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"
  };

  return String(value)
    .replace(/[۰-۹٠-٩]/g, d => digits[d])
    .replace(/[,\s٬]/g, "")
    .replace(/[^\d]/g, "");
}

function formatMoney(amount) {
  return faNumber(amount) + " تومان";
}

function localDateTimeValue(date = new Date()) {
  const offset = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - offset)
    .toISOString()
    .slice(0, 16);
}

function formatDateTime(value) {
  const date = new Date(value);

  if (isNaN(date.getTime())) return "تاریخ نامشخص";

  return new Intl.DateTimeFormat("fa-IR", {
    dateStyle: "short",
    timeStyle: "short"
  }).format(date);
}

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

// -------------------------
// نمایش تاریخ امروز
// -------------------------

document.getElementById("date").textContent =
  new Intl.DateTimeFormat("fa-IR", {
    dateStyle: "full"
  }).format(new Date());

// -------------------------
// ذخیره سازی اطلاعات
// -------------------------

let tasks = readStorage("nova_tasks", []);
let notes = readStorage("nova_notes", []);
let transactions = readStorage("nova_transactions", []);

function saveData() {
  localStorage.setItem("nova_tasks", JSON.stringify(tasks));
  localStorage.setItem("nova_notes", JSON.stringify(notes));
  localStorage.setItem(
    "nova_transactions",
    JSON.stringify(transactions)
  );
}

// -------------------------
// مدیریت کارها
// -------------------------

function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();

  if (!text) {
    alert("اول متن کار رو وارد کن.");
    return;
  }

  tasks.push({
    id: makeId(),
    text: text,
    done: false
  });

  input.value = "";
  saveData();
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  if (tasks.length === 0) {
    list.innerHTML =
      '<p class="empty">هنوز کاری ثبت نشده است.</p>';
    return;
  }

  tasks.forEach(task => {
    const item = document.createElement("div");
    item.className = "item";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.style.width = "auto";
    checkbox.style.margin = "0";

    checkbox.onchange = () => {
      task.done = checkbox.checked;
      saveData();
      renderTasks();
    };

    const span = document.createElement("span");
    span.textContent = task.text;

    if (task.done) span.className = "done";

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "حذف";

    remove.onclick = () => {
      tasks = tasks.filter(t => t.id !== task.id);
      saveData();
      renderTasks();
    };

    item.append(checkbox, span, remove);
    list.appendChild(item);
  });
}

// -------------------------
// مدیریت یادداشت ها
// -------------------------

function addNote() {
  const titleInput = document.getElementById("noteTitle");
  const textInput = document.getElementById("noteText");

  const title = titleInput.value.trim();
  const text = textInput.value.trim();

  if (!title || !text) {
    alert("عنوان و متن یادداشت رو وارد کن.");
    return;
  }

  notes.push({
    id: makeId(),
    title: title,
    text: text,
    createdAt: new Date().toISOString()
  });

  titleInput.value = "";
  textInput.value = "";

  saveData();
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById("noteList");
  list.innerHTML = "";

  if (notes.length === 0) {
    list.innerHTML =
      '<p class="empty">هنوز یادداشتی ثبت نشده است.</p>';
    return;
  }

  notes.forEach(note => {
    const item = document.createElement("div");
    item.className = "item";

    const content = document.createElement("span");

    const title = document.createElement("strong");
    title.textContent = note.title;

    const text = document.createElement("div");
    text.style.fontSize = "12px";
    text.style.color = "#aab7c9";
    text.style.marginTop = "7px";
    text.textContent = note.text;

    content.append(title, text);

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "حذف";

    remove.onclick = () => {
      notes = notes.filter(n => n.id !== note.id);
      saveData();
      renderNotes();
    };

    item.append(content, remove);
    list.appendChild(item);
  });
}

// -------------------------
// مدیریت مالی
// -------------------------

const categories = {
  expense: [
    "خوراک و مواد غذایی",
    "خودرو و بنزین",
    "خانه و اجاره",
    "قبوض و خدمات",
    "پوشاک",
    "سلامت و درمان",
    "تفریح و سرگرمی",
    "خرید شخصی",
    "حمل و نقل",
    "سایر هزینه‌ها"
  ],

  income: [
    "حقوق",
    "درآمد کسب‌وکار",
    "فروش",
    "هدیه",
    "سود سرمایه‌گذاری",
    "سایر درآمدها"
  ]
};

const typeInput = document.getElementById("transactionType");
const categoryInput =
  document.getElementById("transactionCategory");

let editingTransactionId = null;

function updateCategories() {
  const type = typeInput.value;

  categoryInput.innerHTML = "";

  categories[type].forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categoryInput.appendChild(option);
  });
}

typeInput.addEventListener("change", updateCategories);

function resetTransactionForm() {
  editingTransactionId = null;

  document.getElementById("transactionType").value = "expense";
  document.getElementById("transactionAmount").value = "";
  document.getElementById("transactionTitle").value = "";
  document.getElementById("transactionAccount").value = "نقدی";
  document.getElementById("transactionMethod").value = "کارت";
  document.getElementById("transactionDescription").value = "";

  document.getElementById("transactionDate").value =
    localDateTimeValue();

  updateCategories();

  document.getElementById("saveTransactionButton").textContent =
    "+ ثبت تراکنش";

  document.getElementById("cancelEditButton").style.display =
    "none";
}

function cancelEdit() {
  resetTransactionForm();
}

function saveTransaction() {
  const type =
    document.getElementById("transactionType").value;

  const amountText =
    document.getElementById("transactionAmount").value;

  const amount = Number(normalizeNumber(amountText));

  const title =
    document.getElementById("transactionTitle").value.trim();

  const category = categoryInput.value;

  const account =
    document.getElementById("transactionAccount").value;

  const method =
    document.getElementById("transactionMethod").value;

  const date =
    document.getElementById("transactionDate").value;

  const description =
    document.getElementById("transactionDescription").value.trim();

  if (!amount || amount <= 0 || !Number.isSafeInteger(amount)) {
    alert("مبلغ معتبر به تومان وارد کن.");
    return;
  }

  if (!title) {
    alert("عنوان تراکنش رو وارد کن.");
    return;
  }

  if (!date || isNaN(new Date(date).getTime())) {
    alert("تاریخ و ساعت معتبر انتخاب کن.");
    return;
  }

  const transactionData = {
    type,
    amount,
    title,
    category,
    account,
    method,
    date: new Date(date).toISOString(),
    description
  };

  if (editingTransactionId) {
    const index = transactions.findIndex(
      t => t.id === editingTransactionId
    );

    if (index !== -1) {
      transactions[index] = {
        ...transactions[index],
        ...transactionData
      };
    }
  } else {
    transactions.push({
      id: makeId(),
      ...transactionData,
      createdAt: new Date().toISOString()
    });
  }

  saveData();
  resetTransactionForm();
  renderFinance();
}

function editTransaction(id) {
  const transaction = transactions.find(t => t.id === id);

  if (!transaction) return;

  editingTransactionId = id;

  document.getElementById("transactionType").value =
    transaction.type;

  updateCategories();

  document.getElementById("transactionAmount").value =
    String(transaction.amount);

  document.getElementById("transactionTitle").value =
    transaction.title;

  categoryInput.value = transaction.category;

  document.getElementById("transactionAccount").value =
    transaction.account;

  document.getElementById("transactionMethod").value =
    transaction.method;

  document.getElementById("transactionDate").value =
    localDateTimeValue(new Date(transaction.date));

  document.getElementById("transactionDescription").value =
    transaction.description || "";

  document.getElementById("saveTransactionButton").textContent =
    "ذخیره تغییرات";

  document.getElementById("cancelEditButton").style.display =
    "inline-block";

  document.querySelector(".card").scrollIntoView({
    behavior: "smooth"
  });
}

function deleteTransaction(id) {
  if (!confirm("این تراکنش حذف بشه؟")) return;

  transactions = transactions.filter(t => t.id !== id);

  if (editingTransactionId === id) {
    resetTransactionForm();
  }

  saveData();
  renderFinance();
}

// -------------------------
// محاسبه گزارش مالی
// -------------------------

function renderDashboard() {
  let totalIncome = 0;
  let totalExpense = 0;
  let todayExpense = 0;
  let monthExpense = 0;

  const now = new Date();

  transactions.forEach(t => {
    const date = new Date(t.date);

    if (t.type === "income") {
      totalIncome += t.amount;
    } else {
      totalExpense += t.amount;

      if (
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate()
      ) {
        todayExpense += t.amount;
      }

      if (
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth()
      ) {
        monthExpense += t.amount;
      }
    }
  });

  const balance = totalIncome - totalExpense;

  document.getElementById("totalIncome").textContent =
    formatMoney(totalIncome);

  document.getElementById("totalExpense").textContent =
    formatMoney(totalExpense);

  document.getElementById("balance").textContent =
    formatMoney(balance);

  document.getElementById("todayExpense").textContent =
    formatMoney(todayExpense);
}

// -------------------------
// نمایش تراکنش ها
// -------------------------

function renderTransactions() {
  const list = document.getElementById("transactionList");
  const search =
    document.getElementById("transactionSearch").value
      .trim()
      .toLowerCase();

  const filter =
    document.getElementById("transactionFilter").value;

  list.innerHTML = "";

  let filtered = [...transactions];

  if (filter !== "all") {
    filtered = filtered.filter(t => t.type === filter);
  }

  if (search) {
    filtered = filtered.filter(t => {
      const text = [
        t.title,
        t.category,
        t.account,
        t.method,
        t.description
      ].join(" ").toLowerCase();

      return text.includes(search);
    });
  }

  filtered.sort((a, b) =>
    new Date(b.date) - new Date(a.date)
  );

  if (filtered.length === 0) {
    list.innerHTML =
      '<p class="empty">تراکنشی برای نمایش وجود ندارد.</p>';
    return;
  }

  filtered.forEach(t => {
    const box = document.createElement("div");
    box.className = "transaction";

    const top = document.createElement("div");
    top.className = "transaction-top";

    const title = document.createElement("div");
    title.className = "transaction-title";
    title.textContent = t.title;

    const amount = document.createElement("div");
    amount.className =
      "amount " + (t.type === "income" ? "income" : "expense");

    amount.textContent =
      (t.type === "income" ? "+" : "−") +
      formatMoney(t.amount);

    top.append(title, amount);

    const details = document.createElement("div");
    details.className = "transaction-details";

    details.textContent =
      (t.type === "income" ? "درآمد" : "هزینه") +
      " | " + t.category +
      " | حساب: " + t.account +
      " | روش پرداخت: " + t.method +
      " | " + formatDateTime(t.date) +
      (t.description ? " | توضیحات: " + t.description : "");

    const actions = document.createElement("div");
    actions.className = "transaction-actions";

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "ویرایش";
    edit.onclick = () => editTransaction(t.id);

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "حذف";
    remove.onclick = () => deleteTransaction(t.id);

    actions.append(edit, remove);
    box.append(top, details, actions);

    list.appendChild(box);
  });
}

function renderFinance() {
  renderDashboard();
  renderTransactions();
}

// -------------------------
// راه اندازی اولیه
// -------------------------

updateCategories();

document.getElementById("transactionDate").value =
  localDateTimeValue();

renderTasks();
renderNotes();
renderFinance();

</script>

</body>
</html>
